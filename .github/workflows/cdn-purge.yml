name: Refresh CDN
# 发版后刷新 + 预热 CDN。由 deploy/deploy-hk.sh 在部署校验通过后触发：
#   gh workflow run cdn-purge.yml -f sha=<上线的提交>
# 也可以手动跑；sha 留空则取线上 /version.json。
#
# 流程：
#   1. 等线上 /version.json 真的变成目标 sha（部署没完成就一直等，最多 10 分钟）
#   2. 从 glol-web:<sha> 镜像里取出实际在跑的静态文件，和上次 .cdn-hashes.json 比对
#   3. 只对变了的文件 clean_url + pre_cache_url（scripts/cdn-sync.sh）
#   4. 等预热任务跑完（翻 3 页）；失败的从基线剔除，下次发版会重试
#
# 首次运行（没有基线）只写基线、不刷新不预热：index.html / manifest.json 是 no-store，
# assets 带内容哈希，都不会脏读；需要整站强刷用 mode=dir。
#
# 手动全量预热（dist-live 只在 CI 里存在，普通检出目录要先从镜像取文件）：
#   id=$(docker create ghcr.io/idoknow/glol-web:<sha>); docker cp "$id:/usr/share/nginx/html" dist-live
#   echo '{}' > /tmp/e.json
#   DIST=dist-live STATE=/tmp/e.json PREHEAT_ONLY=1 bash scripts/cdn-sync.sh
#
# 兜底：mode=dir 整站刷新。CDNFLY_TOKEN 放在仓库 Actions secrets。
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 已上线的提交（glol-web 镜像 tag）；留空则用线上 /version.json
        required: false
      mode:
        description: sync（只刷变更区块）或 dir（整站刷新）
        default: sync
permissions:
  contents: read
concurrency:
  group: cdn-purge
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      CDNFLY_TOKEN: ${{ secrets.CDNFLY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check token
        id: token
        run: |
          if [ -z "$CDNFLY_TOKEN" ]; then
            echo "::warning::CDNFLY_TOKEN 未配置，跳过 CDN 刷新"
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi
      # token 失效要吵出来：以前没配 secret 时 workflow 一直是“成功但什么都没做”
      - name: Verify token still works
        if: steps.token.outputs.ok == '1'
        run: |
          code=$(curl -s -o /tmp/site.json -w '%{http_code}' --max-time 20 \
            -H "access-token: $CDNFLY_TOKEN" \
            "https://cdn.cdn.sn/v1/sites/86153" || echo 000)
          if [ "$code" != "200" ]; then
            echo "::error::CDNFLY_TOKEN 请求失败（HTTP $code），secret 可能已过期，请更新 CDNFLY_TOKEN"
            head -c 200 /tmp/site.json || true
            exit 1
          fi
          python3 -c "import json;d=json.load(open('/tmp/site.json'));assert str(d.get('code'))in('0',),d" \
            || { echo "::error::CDNFLY_TOKEN 已被拒绝（业务码非 0），请更新 secret"; exit 1; }
          echo "token 可用"
      - name: Resolve target sha
        id: target
        run: |
          sha="${{ inputs.sha }}"
          if [ -z "$sha" ]; then
            sha=$(curl -fsS --max-time 20 "https://glol.rcpd.cc/version.json?t=$(date +%s)" \
              | python3 -c 'import json,sys;print(json.load(sys.stdin)["sha"])')
          fi
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "bad sha: $sha" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "目标版本：$sha"
      # 部署没切过来就等着：预热早于用户能访问没有意义，镜像 tag 也可能还没生效
      - name: Wait until the new version is live
        if: steps.token.outputs.ok == '1' && inputs.mode != 'dir'
        run: |
          sha="${{ steps.target.outputs.sha }}"
          for i in $(seq 1 60); do
            live=$(curl -fsS --max-time 10 "https://glol.rcpd.cc/version.json?t=$(date +%s)" \
              | python3 -c 'import json,sys;print(json.load(sys.stdin)["sha"])' 2>/dev/null || true)
            if [ "$live" = "$sha" ]; then
              echo "线上已是 ${sha:0:7}，开始刷新"
              exit 0
            fi
            echo "第 $i 次：线上 ${live:0:7} ≠ 目标 ${sha:0:7}，10 秒后再看"
            sleep 10
          done
          echo "::error::等了 10 分钟线上仍未切到 ${sha:0:7}"
          exit 1
      - name: Purge whole site
        if: steps.token.outputs.ok == '1' && inputs.mode == 'dir'
        run: bash scripts/cdn-purge.sh dir
      - name: Extract live static files from the deployed image
        if: steps.token.outputs.ok == '1' && inputs.mode != 'dir'
        run: |
          sha="${{ steps.target.outputs.sha }}"
          echo "镜像 ghcr.io/idoknow/glol-web:$sha"
          docker pull -q "ghcr.io/idoknow/glol-web:$sha"
          id=$(docker create "ghcr.io/idoknow/glol-web:$sha")
          docker cp "$id:/usr/share/nginx/html" dist-live
          docker rm "$id" >/dev/null
          du -sh dist-live
      - uses: actions/cache@v4
        if: steps.token.outputs.ok == '1' && inputs.mode != 'dir'
        with:
          path: .cdn-hashes.json
          key: cdn-hashes-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: cdn-hashes-${{ github.ref_name }}-
      - name: Refresh changed CDN blocks
        id: refresh
        if: steps.token.outputs.ok == '1' && inputs.mode != 'dir'
        run: |
          if [ ! -s .cdn-hashes.json ]; then
            # 首次运行 / 基线被回收：只记基线。不 purge（会让用户撞冷启动），
            # 也不全量预热（上万个文件会把任务队列打爆）。
            echo "::notice::没有哈希基线，只记录基线；本次不刷新（下次发版起按变更文件预热）"
            DIST=dist-live STATE=.cdn-hashes.json STATE_ONLY=1 bash scripts/cdn-sync.sh
            echo "submitted=0" >> "$GITHUB_OUTPUT"
          else
            DIST=dist-live STATE=.cdn-hashes.json bash scripts/cdn-sync.sh
            echo "submitted=1" >> "$GITHUB_OUTPUT"
          fi
      # 预热是异步任务：提交成功不代表大文件已经进缓存，等它跑完再收尾。
      # 只扫前 3 页（150 条）覆盖一次发版的变更量；有 pending 就继续等。
      - name: Wait for preheat jobs to finish
        if: steps.token.outputs.ok == '1' && steps.refresh.outputs.submitted == '1'
        run: |
          cat > check_jobs.py <<'PY'
          import glob, json, sys
          rows = []
          for f in sorted(glob.glob('jobs-*.json')):
              try:
                  rows.extend(json.load(open(f)).get('data') or [])
              except Exception:
                  continue
          if not rows:
              print('done=0 pending=0 failed=0'); sys.exit(0)
          def low(r):
              return (r.get('state') or '').lower()
          done = [r for r in rows if low(r) in ('done', 'success', '成功')]
          bad = [r for r in rows if low(r) in ('error', 'fail', 'failed', '失败')]
          wait = [r for r in rows if low(r) in ('pending', 'process', 'running', '等待', '处理中')]
          print('done=%d pending=%d failed=%d' % (len(done), len(wait), len(bad)))
          if wait:
              print('still-waiting')
          if bad:
              print('has-failure')
              with open('failed.txt', 'w') as fh:
                  for r in bad:
                      fh.write((r.get('key2') or '') + '\n')
          PY
          for i in $(seq 1 60); do
            rm -f jobs-*.json
            for page in 1 2 3; do
              curl -fsS --max-time 20 -H "access-token: $CDNFLY_TOKEN" \
                "https://cdn.cdn.sn/v1/jobs?type=pre_cache_url&key1=glol.rcpd.cc&page=$page&limit=50" \
                -o "jobs-$page.json" || true
            done
            summary=$(python3 check_jobs.py)
            echo "第 $i 次：$summary"
            case "$summary" in
              *still-waiting*) sleep 15 ;;
              *) break ;;
            esac
          done
          # 失败的从基线剔除，下次发版会重新提交（否则哈希没变就永远不会重试）
          if [ -f failed.txt ]; then
            python3 - <<'PY'
          import json, os
          failed = {l.strip().split('glol.rcpd.cc', 1)[-1] for l in open('failed.txt') if l.strip()}
          if failed and os.path.exists('.cdn-hashes.json'):
              state = json.load(open('.cdn-hashes.json'))
              before = len(state)
              for p in failed:
                  state.pop(p, None)
              json.dump(state, open('.cdn-hashes.json', 'w'), indent=0, sort_keys=True)
              print('从基线剔除 %d 个预热失败的文件，下次发版重试' % (before - len(state)))
          PY
            echo "::warning::有预热任务失败，已从基线剔除以便下次重试（见 ./scripts/cdn-purge.sh list pre_cache_url）"
          fi
