name: cdn-refresh

# 发版上线后刷新 + 预热 CDN（目录级）。
# 触发：main 有新的合并/推送（= 发版），以及手动 workflow_dispatch。
# 失败不阻断：整个 job continue-on-error，脚本内部也只警告不报错 —— CDN 抽风不该让发版变红。
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cdn-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 刷新入口页 + 预热静态目录
        continue-on-error: true
        env:
          CDNFLY_API_KEY: ${{ secrets.CDNFLY_API_KEY }}
          CDNFLY_API_SECRET: ${{ secrets.CDNFLY_API_SECRET }}
          SITE_HOST: https://glol.rcpd.cc
        run: bash scripts/cdn-refresh-remote.sh

      - name: 结果摘要
        if: always()
        run: echo "CDN 刷新结果见上一步输出（失败只告警，不影响发版）"
