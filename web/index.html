<noscript><main class="noscript"><h1>网上桂林</h1><p>一座按真实地图搭起来的 3D 桂林城。山、江、湖、街区和建筑都依照 OpenStreetMap 与地形数据摆在原位，在浏览器里就能走、骑车、开车或飞上天看山水，电脑和手机都能玩，不用下载。</p><h2>三种玩法</h2><ul><li><b>单人模式</b>：骑电驴、开车穿街走巷，接单送米粉、拉客、跑夜赛，赚了钱换车换装。</li><li><b>联机模式</b>：和其他玩家同城逛街骑车，看得到彼此的样子和昵称。</li><li><b>游览模式</b>：自由飞行看山水，走遍十处名胜集印章。</li></ul><h2>能逛到的名胜</h2><ul><li>象鼻山 · 水月洞 · 桂林城徽</li><li>日月双塔 · 杉湖 · 两江四湖</li><li>解放桥 · 漓江 · 城中与七星之间</li><li>逍遥楼 · 东城墙 · 临江城楼</li><li>伏波山 · 还珠洞 · 试剑石</li><li>叠彩山 · 明月峰 · 拿云亭</li><li>独秀峰 · 靖江王城 · 南天一柱</li><li>古南门 · 榕湖 · 古榕双桥</li><li>东西巷 · 正阳门外 · 老街巷</li><li>十字街 · 中山中路 · 解放路</li></ul><p>网上桂林需要开启 JavaScript 和 WebGL 才能运行，请在浏览器设置里打开 JavaScript 后刷新本页。</p></main></noscript>
