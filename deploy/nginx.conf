# Traefik must overwrite X-Real-IP with the peer address. Cloudflare ranges:
# https://www.cloudflare.com/ips-v4 and https://www.cloudflare.com/ips-v6
geo $http_x_real_ip $glol_cf_peer {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}
map $http_x_real_ip $glol_peer_ip {
    default $http_x_real_ip;
    "" $remote_addr;
}
map "$glol_cf_peer:$http_cf_connecting_ip" $glol_client_ip {
    default $glol_peer_ip;
    ~^1:.+ $http_cf_connecting_ip;
}
map $glol_cf_peer $glol_country { default ""; 1 $http_cf_ipcountry; }
server {
    listen 8080;
    # Behind Traefik/Cloudflare: never build absolute redirects from the internal port/scheme (/admin -> /admin/ went to :8080).
    absolute_redirect off;
    root /usr/share/nginx/html;
    client_max_body_size 16m;
    add_header Cache-Control "no-cache";
    location = /api/t {
        access_log off;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header CF-IPCountry $glol_country;
        proxy_set_header CF-Connecting-IP $glol_client_ip;
        proxy_hide_header X-Powered-By;
        add_header Cache-Control "private, no-store" always;
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header CF-IPCountry $glol_country;
        proxy_set_header CF-Connecting-IP $glol_client_ip;
        proxy_hide_header X-Powered-By;
        add_header Cache-Control "private, no-store" always;
    }
    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.[A-Za-z0-9]+$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~ (?:\.html|/world/manifest\.json|/version\.json)$ {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
}
server {
    listen 127.0.0.1:8081;
    location = /status { stub_status; access_log off; }
    location / { return 404; }
}
