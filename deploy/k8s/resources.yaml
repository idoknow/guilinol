apiVersion: v1
kind: Service
metadata:
  name: glol-postgres
  namespace: idoknow
spec:
  selector:
    app.kubernetes.io/name: glol-postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: glol-postgres
  namespace: idoknow
spec:
  storageClassName: local-path
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: glol-minio
  namespace: idoknow
spec:
  selector:
    app.kubernetes.io/name: glol-minio
  ports:
  - port: 9000
    targetPort: 9000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: glol-minio
  namespace: idoknow
spec:
  storageClassName: local-path
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: glol-web
  namespace: idoknow
spec:
  selector:
    app.kubernetes.io/name: glol-web
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glol-postgres
  namespace: idoknow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: glol-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glol-postgres
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: cn-hk-fxy-01
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - 10.42.10.1
      imagePullSecrets:
      - name: glol-registry
      containers:
      - name: glol-postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        resources:
          requests:
            memory: 96Mi
            cpu: 50m
          limits:
            memory: 384Mi
            cpu: '1'
        readinessProbe:
          tcpSocket:
            port: 5432
          periodSeconds: 5
        env:
        - name: POSTGRES_DB
          value: glol
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: glol-env
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: glol-postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glol-minio
  namespace: idoknow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: glol-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glol-minio
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: cn-hk-fxy-01
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - 10.42.10.1
      imagePullSecrets:
      - name: glol-registry
      containers:
      - name: glol-minio
        image: cgr.dev/chainguard/minio@sha256:0f9fda72fbc6bd3560ea903aec2ceefa20f6ba82628d67656f37fb370c39ae9c
        ports:
        - containerPort: 9000
        resources:
          requests:
            memory: 160Mi
            cpu: 50m
          limits:
            memory: 512Mi
            cpu: '1'
        readinessProbe:
          tcpSocket:
            port: 9000
          periodSeconds: 5
        args:
        - server
        - /data
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: glol-env
              key: AWS_ACCESS_KEY_ID
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: glol-env
              key: AWS_SECRET_ACCESS_KEY
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: glol-minio
      securityContext:
        fsGroup: 65532
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glol-web
  namespace: idoknow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: glol-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glol-web
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: cn-hk-fxy-01
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - 10.42.10.1
      imagePullSecrets:
      - name: glol-registry
      containers:
      - name: glol-nginx
        image: ghcr.io/idoknow/glol-web:RELEASE
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: 12Mi
            cpu: 10m
          limits:
            memory: 64Mi
            cpu: '1'
        readinessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 5
      - name: glol-api
        image: ghcr.io/idoknow/glol-api:RELEASE
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 384Mi
            cpu: '1'
        readinessProbe:
          tcpSocket:
            port: 3000
          periodSeconds: 5
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: glol-env
              key: POSTGRES_PASSWORD
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: glol-env
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: glol-env
              key: AWS_SECRET_ACCESS_KEY
        - name: RESEND_API_KEY
          valueFrom:
            secretKeyRef:
              name: glol-env
              key: RESEND_API_KEY
        - name: BRIDGE_TOKEN
          valueFrom:
            secretKeyRef:
              name: glol-env
              key: BRIDGE_TOKEN
        - name: DATABASE_URL
          value: postgres://postgres:$(POSTGRES_PASSWORD)@$(GLOL_POSTGRES_SERVICE_HOST):5432/glol
        - name: S3_ENDPOINT
          value: http://$(GLOL_MINIO_SERVICE_HOST):9000
        - name: PUBLIC_ORIGIN
          value: https://glol.rcpd.cc
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: glol-web
  namespace: idoknow
  annotations:
    cert-manager.io/issuer: letsencrypt-idoknow
    nginx.ingress.kubernetes.io/proxy-body-size: 16m
spec:
  ingressClassName: hongkong
  tls:
  - hosts:
    - glol.rcpd.cc
    secretName: glol-tls
  rules:
  - host: glol.rcpd.cc
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: glol-web
            port:
              number: 8080
