apiVersion: v1
kind: Service
metadata:
  name: glol-postgres
  namespace: idoknow
spec:
  selector:
    app.kubernetes.io/name: glol-postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: glol-postgres
  namespace: idoknow
spec:
  storageClassName: local-path
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: glol-minio
  namespace: idoknow
spec:
  selector:
    app.kubernetes.io/name: glol-minio
  ports:
  - port: 9000
    targetPort: 9000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: glol-minio
  namespace: idoknow
spec:
  storageClassName: local-path
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: glol-web
  namespace: idoknow
spec:
  selector:
    app.kubernetes.io/name: glol-web
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glol-postgres
  namespace: idoknow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: glol-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glol-postgres
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: cn-hk-fxy-01
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - 10.42.10.1
      containers:
      - name: glol-postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        resources:
          requests:
            memory: 96Mi
            cpu: 50m
          limits:
            memory: 384Mi
            cpu: '1'
        readinessProbe:
          tcpSocket:
            port: 5432
          periodSeconds: 5
        env:
        - name: POSTGRES_DB
          value: glol
        - name: POSTGRES_USER
          value: postgres
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: glol-env
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: glol-postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glol-minio
  namespace: idoknow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: glol-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glol-minio
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: cn-hk-fxy-01
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - 10.42.10.1
      containers:
      - name: glol-minio
        image: cgr.dev/chainguard/minio@sha256:0f9fda72fbc6bd3560ea903aec2ceefa20f6ba82628d67656f37fb370c39ae9c
        ports:
        - containerPort: 9000
        resources:
          requests:
            memory: 160Mi
            cpu: 50m
          limits:
            memory: 512Mi
            cpu: '1'
        readinessProbe:
          tcpSocket:
            port: 9000
          periodSeconds: 5
        args:
        - server
        - /data
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: glol-env
              key: AWS_ACCESS_KEY_ID
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: glol-env
              key: AWS_SECRET_ACCESS_KEY
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: glol-minio
      securityContext:
        fsGroup: 65532
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glol-web
  namespace: idoknow
spec:
  replicas: 1
  revisionHistoryLimit: 5
  # 新 pod 稳定 10 秒才算 Ready，避免启动即抖动的 pod 立刻接流量
  minReadySeconds: 10
  progressDeadlineSeconds: 300
  # maxUnavailable: 0 —— 新 pod 就绪前不摘老 pod，发版期间始终有可用端点
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: glol-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glol-web
    spec:
      automountServiceAccountToken: false
      # 给 preStop 摘流量 + 在途请求跑完留时间（API 侧 SIGTERM 兜底 20s）
      terminationGracePeriodSeconds: 45
      nodeSelector:
        kubernetes.io/hostname: cn-hk-fxy-01
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - 10.42.10.1
      containers:
      - name: glol-nginx
        image: ghcr.io/idoknow/glol-web:RELEASE
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: 12Mi
            cpu: 10m
          limits:
            memory: 64Mi
            cpu: '1'
        readinessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 5
          failureThreshold: 2
        lifecycle:
          # 先让 Ingress 把流量从本 pod 摘掉，再退出
          preStop:
            exec:
              command: ['sh','-c','sleep 5']
      - name: glol-api
        image: ghcr.io/idoknow/glol-api:RELEASE
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 384Mi
            cpu: '1'
        # 启动期不判死（tsx 冷启动 + 连接池建立可能要十几秒）
        startupProbe:
          httpGet:
            path: /api/health
            port: 3000
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 30
        # 就绪 = DB 真的通（/api/ready 会 select 1），滚动更新据此决定能否接流量
        readinessProbe:
          httpGet:
            path: /api/ready
            port: 3000
          periodSeconds: 3
          timeoutSeconds: 2
          failureThreshold: 2
          successThreshold: 1
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ['sh','-c','sleep 5']
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: glol-env
              key: POSTGRES_PASSWORD
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: glol-env
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: glol-env
              key: AWS_SECRET_ACCESS_KEY
        - name: RESEND_API_KEY
          valueFrom:
            secretKeyRef:
              name: glol-env
              key: RESEND_API_KEY
        - name: BRIDGE_TOKEN
          valueFrom:
            secretKeyRef:
              name: glol-env
              key: BRIDGE_TOKEN
        - name: DATABASE_URL
          value: postgres://postgres:$(POSTGRES_PASSWORD)@$(GLOL_POSTGRES_SERVICE_HOST):5432/glol
        - name: S3_ENDPOINT
          value: http://$(GLOL_MINIO_SERVICE_HOST):9000
        - name: PUBLIC_ORIGIN
          value: https://glol.rcpd.cc
        # 聚合登录：appid/appkey 只来自 secret，平台开关与回调地址是明文配置
        # optional: true —— secret 缺 key 时 pod 照常启动，聚合登录自己返回 social_unconfigured，不拖垮整站
        - name: SOCIAL_APPID
          valueFrom:
            secretKeyRef:
              name: glol-env
              key: SOCIAL_APPID
              optional: true
        - name: SOCIAL_APPKEY
          valueFrom:
            secretKeyRef:
              name: glol-env
              key: SOCIAL_APPKEY
              optional: true
        - name: SOCIAL_HOST
          value: https://login.mapay.cn
        - name: SOCIAL_REDIRECT
          value: https://glol.rcpd.cc/api/auth/social/callback
        - name: SOCIAL_ENABLED
          value: qq,wx
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: glol-tls
  namespace: idoknow
spec:
  secretName: glol-tls
  issuerRef: {kind: Issuer, name: letsencrypt-idoknow}
  dnsNames: [glol.rcpd.cc]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: glol-web
  namespace: idoknow
spec:
  ingressClassName: hongkong
  tls:
  - hosts:
    - glol.rcpd.cc
    secretName: glol-tls
  rules:
  - host: glol.rcpd.cc
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: glol-web
            port:
              number: 8080

---
# 单节点也要有：节点 drain/升级时不允许把唯一副本一次性带走
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: glol-web
  namespace: idoknow
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: glol-web
