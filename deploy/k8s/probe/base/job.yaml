apiVersion: batch/v1
kind: CronJob
metadata:
  name: glol-perf-probe
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 180
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 160
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          tolerations:
          - {key: migration.rockchin.top/hold, operator: Exists}
          - {key: workload.rockchin.top/langbot-cloud-excluded, operator: Exists}
          containers:
          - name: curl
            image: ghcr.nju.edu.cn/idoknow/glol-probe:RELEASE
            command: ["/bin/sh", "/probe/run.sh"]
            env:
            - name: PROBE_SESSION
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - name: PROBE_NODE
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            resources:
              requests: {cpu: 5m, memory: 8Mi}
              limits: {cpu: 100m, memory: 24Mi}
            volumeMounts:
            - {name: script, mountPath: /probe, readOnly: true}
          volumes:
          - name: script
            configMap: {name: glol-probe-script}
